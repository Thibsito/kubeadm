- name: "CONTROL-PLANE | 1. Initialiser le cluster Kubernetes"
  block:
    - name: "CONTROL-PLANE | Lancer 'kubeadm init' sur le premier nœud maître"
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --control-plane-endpoint={{ control_plane_endpoint }}
        --kubernetes-version=v{{ kubernetes_version.split('-')[0] }}
        --upload-certs
      args:
        # Cette ligne rend la tâche idempotente : elle ne s'exécutera que si ce fichier n'existe pas.
        creates: /etc/kubernetes/admin.conf
      register: init_cluster
  become: yes
  # Cette condition garantit que le bloc ne s'exécute QUE sur le premier serveur du groupe [kube_control_plane]
  when: inventory_hostname == groups['kube_control_plane'][0]

# ... Le reste du fichier ne change pas ...

- name: "CONTROL-PLANE | 2. Configurer kubectl pour l'utilisateur non-root"
  block:
    - name: "CONTROL-PLANE | Créer le répertoire .kube pour l'utilisateur"
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: "CONTROL-PLANE | Copier le fichier admin.conf pour permettre l'accès au cluster"
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
  become: yes

- name: "CONTROL-PLANE | 3. Récupérer la commande de jonction pour les workers"
  block:
    - name: "CONTROL-PLANE | Obtenir la commande de jonction avec 'kubeadm token create'"
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: "CONTROL-PLANE | Stocker la commande de jonction dans un 'fact' pour une utilisation ultérieure"
      ansible.builtin.set_fact:
        join_command: "{{ join_command_raw.stdout_lines[0] }}"
  become: yes
  when: inventory_hostname == groups['kube_control_plane'][0]